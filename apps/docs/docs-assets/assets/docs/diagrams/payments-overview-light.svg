  <g><rect x="750" y="110" width="200" height="140" rx="12" fill="none" stroke="#0f9e94" stroke-width="2.62"/><text class="label" x="850" y="170" text-anchor="middle">Merchant</text><text class="meta" x="850" y="199" text-anchor="middle">receives funds</text></g>
