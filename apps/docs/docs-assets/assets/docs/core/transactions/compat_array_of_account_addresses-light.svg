<svg data-sol-type="1" xmlns="http://www.w3.org/2000/svg" width="688" height="220" viewBox="0 0 688 220" role="img" aria-label="Account addresses: signers first, then non-signers; writable before read-only"><style id="sol-diagram-fonts">@font-face{font-family:"Diatype";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}</style><title>Account addresses: signers first, then non-signers; writable before read-only</title><defs><marker id="ah-light" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="184" y="8" width="320" height="56" rx="8" fill="#e6f8f6" stroke="#0f9e94" stroke-width="1.5"/><text x="344" y="26.9" dominant-baseline="central" text-anchor="middle" font-family="Diatype,Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400" fill="#18181b"><tspan>Compact array of account addresses</tspan></text><text x="344" y="45.1" dominant-baseline="central" text-anchor="middle" font-family="Diatype,Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400" fill="#18181b"><tspan fill="#52525b">32 bytes × number of accounts</tspan></text><path d="M344 64 L344 100" fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-light)"/><rect x="8" y="106" width="332" height="56" rx="8" fill="#f3edff" stroke="#7c3aed" stroke-width="1.5"/><text x="174" y="124.9" dominant-baseline="central" text-anchor="middle" font-family="Diatype,Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400" fill="#18181b"><tspan>Accounts that sign</tspan></text><text x="174" y="143.1" dominant-baseline="central" text-anchor="middle" font-family="Diatype,Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400" fill="#18181b"><tspan fill="#52525b">32 bytes × signers</tspan></text><rect x="8" y="170" width="162" height="40" rx="8" fill="none" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="89" y="190.0" dominant-baseline="central" text-anchor="middle" font-family="Diatype,Inter,ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52525b"><tspan>Writable</tspan></text><rect x="178" y="170" width="162" height="40" rx="8" fill="none" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="259" y="190.0" dominant-baseline="central" text-anchor="middle" font-family="Diatype,Inter,ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52525b"><tspan>Read-only</tspan></text><rect x="348" y="106" width="332" height="56" rx="8" fill="#f3edff" stroke="#7c3aed" stroke-width="1.5"/><text x="514" y="124.9" dominant-baseline="central" text-anchor="middle" font-family="Diatype,Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400" fill="#18181b"><tspan>Accounts that do not sign</tspan></text><text x="514" y="143.1" dominant-baseline="central" text-anchor="middle" font-family="Diatype,Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400" fill="#18181b"><tspan fill="#52525b">32 bytes × non-signers</tspan></text><rect x="348" y="170" width="162" height="40" rx="8" fill="none" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="429" y="190.0" dominant-baseline="central" text-anchor="middle" font-family="Diatype,Inter,ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52525b"><tspan>Writable</tspan></text><rect x="518" y="170" width="162" height="40" rx="8" fill="none" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="599" y="190.0" dominant-baseline="central" text-anchor="middle" font-family="Diatype,Inter,ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52525b"><tspan>Read-only</tspan></text></svg>
