packages:
  - apps/*
  - packages/*

patchedDependencies:
  # Keystatic 0.6.9 still wraps inline MDX components in paragraphs inside
  # table cells, which rejects existing media upgrade content on load.
  "@keystatic/core@0.6.9": patches/@keystatic__core@0.6.9.patch
  braces@3.0.3: patches/braces@3.0.3.patch

# Avoid implicit installs (and repeated workspace lifecycle scripts) before
# every `pnpm run` and `pnpm exec`; CI and setup invoke install explicitly.
verifyDepsBeforeRun: false

catalog:
  "@boxicons/react": ^1.0.3
  clsx: ^2.1.1
  date-fns: ^4.1.0
  lodash: ^4.17.23
  motion: ^12.23.28
  next: 16.4.2
  next-intl: 4.14.9
  react: 19.2.8
  react-dom: 19.2.8
  vitest: 4.1.8

# Class merging must follow the Tailwind generation that authored the classes.
# Shared UI packages use the v4 merger. apps/web runs Tailwind 4 but keeps its
# Tailwind 3 class names (see apps/web/src/app/globals.css), so it keeps the
# v3 merger.
catalogs:
  tailwind3:
    tailwind-merge: ^2.6.1
  tailwind4:
    tailwind-merge: ^3.3.1

overrides:
  # @vercel/blob permits ^3.6.1; retain the aged OIDC release until the
  # newer release clears the package-age policy.
  "@vercel/oidc": 3.6.1
  # Keep transitive build tooling on the release patched for GHSA-g7r4-m6w7-qqqr.
  "esbuild@>=0.17.0 <0.28.1": 0.28.1
  # Pin transitive releases containing the latest Immutable.js 5 security fixes.
  "immutable@>=5.0.0-beta.1 <5.1.8": 5.1.9
  # Keep transitive PostCSS consumers on a release patched for
  # GHSA-6g55-p6wh-862q and GHSA-r28c-9q8g-f849.
  "postcss@<=8.5.17": 8.5.18
  # Keep transitive nanoid consumers (postcss, @ai-sdk/provider-utils) on the
  # release patched for GHSA-2v37-7h3g-55p8.
  "nanoid@<3.3.18": 3.3.18
  # PostCSS consumers resolve source-map-js 1.2.1; keep them on the release
  # patched for GHSA-68fv-2mgg-jv7q.
  "source-map-js@>=1.0.0 <1.2.2": 1.2.2
  # Sentry's glob 9 dependency resolves minimatch 8, whose brace-expansion 2
  # fix is still inside the package-age quarantine window. Use the compatible
  # minimatch 9 release already present in the workspace instead.
  "glob@9.3.5>minimatch": 9.0.7
  # Keep every Sharp consumer on the current patched release containing the
  # updated libvips binaries (GHSA-wq5f-xc86-pv6w). Next.js 16 already
  # requests ^0.35.5; the override covers older transitive requests.
  "sharp@<0.35.5": 0.35.5
  # get-uri (via @databricks/sql > proxy-agent) still requests basic-ftp 5,
  # but GHSA-c475-qrg2-pj4r is fixed only in 6.2.1. The 6.x major only changes
  # the default to reject separate transfer hosts; the Client API get-uri uses
  # is unchanged.
  "basic-ftp@<6.2.1": 6.2.1
  # ai v4 pins jsondiffpatch 0.6, which is fixed only in a later compatible
  # release; keep the direct ai update above while bridging that exact pin.
  "ai>jsondiffpatch": 0.7.6
  # @metaplex-foundation/mpl-token-metadata-kit has published only 0.0.3, which
  # depends on kit 6. The cookbook needs kit 8 for the transaction v1 APIs, and
  # a second kit instance rebrands the @solana/rpc-types nominal types, making
  # otherwise-identical RPC types unassignable across the boundary. Resolve the
  # package onto the single kit the workspace installs.
  "@metaplex-foundation/mpl-token-metadata-kit>@solana/kit": ^8.4.0
  "@metaplex-foundation/mpl-token-metadata-kit>@solana/program-client-core": ^8.4.0
  # The tokenization tutorials use the Mosaic SDK and the Token ACL clients,
  # which declare @solana/kit ^6 as a regular dependency. Resolve them onto the
  # workspace's single kit 8 for the same reason as the Metaplex client above.
  "@solana/mosaic-sdk>@solana/kit": ^8.4.0
  "@solana/token-acl-sdk>@solana/kit": ^8.4.0
  "@solana/token-acl-gate-sdk>@solana/kit": ^8.4.0
  # The Mosaic SDK also depends on @solana/sysvars ^6 (for one address
  # constant), which pnpm would then hand to @solana-program/token-2022 0.19 as
  # its peer. Keep the workspace on kit 8's sysvars.
  "@solana/mosaic-sdk>@solana/sysvars": ^8.4.0
  # @solana/token-acl-sdk 0.4.0 pins @solana-program/token-2022 0.12.0, which
  # imports getMinimumBalanceForRentExemption from @solana/kit, an export kit 8
  # no longer has, so the module fails to load. Resolve it onto the cookbook's
  # token-2022, which exports everything the Token ACL client imports; the
  # tokenization tutorials tell readers to do the same.
  "@solana/token-acl-sdk>@solana-program/token-2022": ^0.19.0

auditConfig:
  ignoreGhsas:
    # braces has no published fixed version yet. The local patch caps parser
    # nesting before recursive compile/expand can exhaust the process stack.
    # Remove this ignore and patch when a fixed release is available.
    - GHSA-vfj7-8cjw-p6xm
    # image-size has not published the >=2.0.3 patched release yet. Fumadocs
    # only uses it for trusted, repository-owned assets; remove these ignores
    # as soon as the patched release is available.
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
    # Prisma 6 pins these packages in its CLI-only configuration loader. The
    # loader reads the repository-owned Prisma schema/config, not request data.
    # Remove these exceptions when Prisma ships compatible patched releases.
    - GHSA-38f7-945m-qr2g
    - GHSA-ggr8-5vv4-36mx

allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  "@swc/core": true
  bigint-buffer: true
  bufferutil: true
  core-js: false
  esbuild: true
  lz4: true
  prisma: true
  sharp: true
  utf-8-validate: true

# Allow the newly published security patches through the workspace's package
# age policy while they age normally for future installs.
minimumReleaseAgeExclude:
  # Next.js 16.4.1 fixes GHSA-673q-mjm6-r5xr, GHSA-2464-fhr4-w9xw and
  # GHSA-p3m5-59mp-jv5r; 16.4.2 is the current patch release on top of it.
  - next@16.4.2
  - "@next/env@16.4.2"
  - "@next/swc-darwin-arm64@16.4.2"
  - "@next/swc-darwin-x64@16.4.2"
  - "@next/swc-linux-arm64-gnu@16.4.2"
  - "@next/swc-linux-arm64-musl@16.4.2"
  - "@next/swc-linux-x64-gnu@16.4.2"
  - "@next/swc-linux-x64-musl@16.4.2"
  - "@next/swc-win32-arm64-msvc@16.4.2"
  - "@next/swc-win32-x64-msvc@16.4.2"
  - "@next/bundle-analyzer@16.4.2"
  - "@next/mdx@16.4.2"
  - jsondiffpatch@0.7.6
  - browserslist@4.28.7
  - fast-uri@3.1.7
  - "@solana/keychain-core@2.0.0"
  - "@solana/keychain-memory@2.0.0"
  - "@solana/web3.js@3.0.2"
